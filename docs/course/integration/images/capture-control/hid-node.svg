<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="C HID 服务连接 Go 后端与被控设备">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
    <style>
      .node { fill: #f4f4f4; stroke: #b5b5b5; stroke-width: 1.2; }
      .title { font: 600 17px "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #222; text-anchor: middle; }
      .sub { font: 14px "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #666; text-anchor: middle; }
      .label { font: 14px "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #444; text-anchor: middle; }
      .arrow { stroke: #666; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <rect class="node" x="30" y="85" width="150" height="90" rx="8"/>
  <text class="title" x="105" y="120">浏览器</text>
  <text class="sub" x="105" y="146">网页输入</text>

  <rect class="node" x="300" y="85" width="160" height="90" rx="8"/>
  <text class="title" x="380" y="120">Go 后端</text>
  <text class="sub" x="380" y="146">kvm_app</text>

  <rect class="node" x="580" y="85" width="180" height="90" rx="8"/>
  <text class="title" x="670" y="120">C HID 服务</text>
  <text class="sub" x="670" y="146">Gadget + HID IPC</text>

  <rect class="node" x="840" y="85" width="130" height="90" rx="8"/>
  <text class="title" x="905" y="120">USB Gadget</text>
  <text class="sub" x="905" y="146">hidg0 / 1 / 2</text>

  <line class="arrow" x1="180" y1="130" x2="300" y2="130"
        marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="label" x="240" y="116">HTTP / WebRTC</text>

  <line class="arrow" x1="460" y1="130" x2="580" y2="130"
        marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="label" x="520" y="116">HID IPC</text>

  <line class="arrow" x1="760" y1="130" x2="840" y2="130" marker-end="url(#arrow)"/>
  <text class="label" x="800" y="116">HID 报告</text>
</svg>
